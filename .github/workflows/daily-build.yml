name: Daily Build

on:
  # 仅支持手动触发，避免不必要的构建
  workflow_dispatch:

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 给 release 构建加 .dev 后缀，避免与官方版冲突；debug 保持 .debug
          sed -i '/signingConfig = signingConfigs.getByName("release")/a\            applicationIdSuffix = ".dev"' app/build.gradle.kts

          # 在 CI 环境中生成临时自签名 keystore（仅用于测试构建）
          keytool -genkey -v \
            -keystore app/app.key \
            -alias rikkahub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rikkahub123 \
            -keypass rikkahub123 \
            -dname "CN=RikkaHub Build"

          # 写入签名配置到 local.properties
          cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=rikkahub123
          keyAlias=rikkahub
          keyPassword=rikkahub123
          EOF

          # 用 Python 生成格式正确的 Google Services 配置
          python3 - <<'PYEOF'
          import json
          config = {
              "project_info": {
                  "project_number": "123456789",
                  "project_id": "rikkahub-build",
                  "storage_bucket": "rikkahub-build.appspot.com"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789:android:0000000000000000000000",
                      "android_client_info": {
                          "package_name": "me.rerere.rikkahub.dev"
                      }
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": "dummy-api-key-for-build-only"}],
                  "services": {"appinvite_service": {"status": 1}}
              }],
              "configuration_version": "1"
          }
          with open("app/google-services.json", "w") as f:
              json.dump(config, f, indent=2)
          PYEOF

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare release info
        id: relinfo
        run: |
          # 读取 app 版本号
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # 生成时间戳（北京时间）
          BUILD_TIME=$(date +'%Y%m%d-%H%M')
          # 组合 tag 和 release 名称
          TAG_NAME="v${VERSION_NAME}-${BUILD_TIME}"
          RELEASE_NAME="RikkaHub Build ${VERSION_NAME} (${BUILD_TIME})"

          # 生成 release notes
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          BRANCH=${{ github.ref_name }}

          # 获取最近 10 条提交作为变更日志
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 10)

          BODY=$(cat <<EOF
          RikkaHub 自动构建版本

          - 版本号：${VERSION_NAME}
          - 构建时间：${BUILD_TIME}
          - 分支：${BRANCH}
          - Commit：${COMMIT_SHA}
          - 包名：me.rerere.rikkahub.dev（与官方版共存）

          ## 最近变更
          ${CHANGELOG}

          > ⚠️ 这是开发测试版本，可能不稳定，仅供测试使用。
          EOF
          )

          # 多行输出转义
          {
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "version_name=${VERSION_NAME}"
            echo "build_time=${BUILD_TIME}"
          } >> "$GITHUB_OUTPUT"

          # body 写入文件，避免多行字符串在 with 中出问题
          echo "$BODY" > /tmp/release_body.md

      # 每次编译创建新的 Release，不覆盖旧版本
      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.relinfo.outputs.tag_name }}
          name: ${{ steps.relinfo.outputs.release_name }}
          prerelease: true
          body_path: /tmp/release_body.md
          files: app/build/outputs/apk/release/*.apk
